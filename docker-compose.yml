version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pmesh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmesh
      POSTGRES_PASSWORD: pmesh_dev
      POSTGRES_DB: pmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
